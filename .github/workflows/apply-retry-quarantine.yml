name: Inspect provider classification patch payload

on:
  push:
    branches:
      - agent/retry-backoff-projection-quarantine

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 5

      - name: Recover and inspect patch script
        run: |
          git show d5ffced6ae66cc3d1764c6a935762d1b0fe7dbfa:.github/workflows/apply-retry-quarantine.yml \
            | awk '/^H4s/{capture=1} /^PAYLOAD$/{capture=0} capture' \
            > /tmp/apply_retry_quarantine.py.gz.b64
          base64 --decode /tmp/apply_retry_quarantine.py.gz.b64 \
            > /tmp/apply_retry_quarantine.py.gz
          gzip --decompress --stdout /tmp/apply_retry_quarantine.py.gz \
            > /tmp/apply_retry_quarantine.py || true
          python -m py_compile /tmp/apply_retry_quarantine.py
          echo '--- provider patch range ---'
          sed -n '700,980p' /tmp/apply_retry_quarantine.py
          echo '--- suspicious blank type annotations ---'
          grep -nE '[A-Za-z_]+:[[:space:]]{4,}[),]' /tmp/apply_retry_quarantine.py || true
          grep -nE '[A-Za-z_]+[[:space:]]{5,}\)' /tmp/apply_retry_quarantine.py || true
