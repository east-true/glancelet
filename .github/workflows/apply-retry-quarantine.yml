name: Inspect generated retry hardening sources

on:
  push:
    branches:
      - agent/retry-backoff-projection-quarantine

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Recover patch and inspect generated sources
        run: |
          git show d5ffced6ae66cc3d1764c6a935762d1b0fe7dbfa:.github/workflows/apply-retry-quarantine.yml \
            | awk '/^H4s/{capture=1} /^PAYLOAD$/{capture=0} capture' \
            > /tmp/apply_retry_quarantine.py.gz.b64
          base64 --decode /tmp/apply_retry_quarantine.py.gz.b64 \
            > /tmp/apply_retry_quarantine.py.gz
          gzip --decompress --stdout /tmp/apply_retry_quarantine.py.gz \
            > /tmp/apply_retry_quarantine.py || true
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_retry_quarantine.py')
          text = path.read_text()
          text = text.replace('message      ', 'message: &str')
          text = text.replace('reason:     ', 'reason: &str')
          path.write_text(text)
          PY
          python /tmp/apply_retry_quarantine.py
          echo '--- RetryAdapter source in patch ---'
          grep -n -B 25 -A 80 'RetryAdapter' /tmp/apply_retry_quarantine.py
          echo '--- generated retry tests ---'
          nl -ba crates/glancelet-core/tests/review_fixes.rs | sed -n '620,920p'
          echo '--- suspicious truncated Rust keywords ---'
          grep -RInE '(^|[[:space:]])(uct|ruct|mpl|num|ub)[[:space:]]+[A-ZA-Za-z_]' \
            crates/glancelet-core apps/desktop/src-tauri || true
