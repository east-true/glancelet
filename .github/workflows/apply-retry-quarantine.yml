name: Apply retry and projection quarantine hardening

on:
  push:
    branches:
      - agent/retry-backoff-projection-quarantine

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Recover and apply implementation
        run: |
          git show HEAD^:.github/workflows/apply-retry-quarantine.yml \
            | awk '/^H4s/{capture=1} /^PAYLOAD$/{capture=0} capture' \
            > /tmp/apply_retry_quarantine.py.gz.b64
          test -s /tmp/apply_retry_quarantine.py.gz.b64
          base64 --decode /tmp/apply_retry_quarantine.py.gz.b64 \
            | gzip --decompress \
            > /tmp/apply_retry_quarantine.py
          python /tmp/apply_retry_quarantine.py
          rm .github/workflows/apply-retry-quarantine.yml
          cargo fmt --all
          git diff --check

      - name: Validate Rust
        run: |
          cargo check -p glancelet-desktop --all-features
          cargo clippy -p glancelet-core --all-targets --all-features -- -D warnings
          cargo clippy -p glancelet-desktop --all-targets --all-features -- -D warnings
          cargo test -p glancelet-core

      - name: Validate frontend
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm test
          npm run build

      - name: Commit and push implementation
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden retries and quarantine terminal projections"
          git push origin "HEAD:${GITHUB_REF_NAME}"
