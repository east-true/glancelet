name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rust=false
          web=false

          while IFS= read -r -d '' file; do
            case "$file" in
              Cargo.toml|Cargo.lock|rustfmt.toml|crates/*|apps/desktop/src-tauri/*)
                rust=true
                ;;
              package.json|package-lock.json|.prettierignore)
                web=true
                ;;
              apps/desktop/*)
                web=true
                ;;
              .github/workflows/ci.yml)
                rust=true
                web=true
                ;;
              docs/*|*.md|LICENSE|.gitignore|.editorconfig|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md|.github/dependabot.yml)
                ;;
              *)
                # Unknown paths are treated conservatively so new code or
                # build files cannot silently bypass either validation suite.
                rust=true
                web=true
                ;;
            esac
          done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-provider: github
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check native desktop
        run: cargo check -p glancelet-desktop --all-features
      - name: Clippy core
        run: cargo clippy -p glancelet-core --all-targets --all-features -- -D warnings
      - name: Clippy native desktop
        run: cargo clippy -p glancelet-desktop --all-targets --all-features -- -D warnings
      - name: Test core
        run: cargo test -p glancelet-core

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend formatting
        run: npm run format:check
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
