name: Fix PR 47 Slack retry expectation

on:
  push:
    branches:
      - agent/retry-backoff-projection-quarantine

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Align Slack retry expectation with bounded jitter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/glancelet-core/tests/slack.rs')
          text = path.read_text()
          function_start = text.index(
              'async fn reactions_collect_every_page_and_page_two_failure_returns_no_batch()'
          )
          function_end = text.index('\n#[tokio::test]\n', function_start)
          test = text[function_start:function_end]

          pattern = re.compile(
              r'assert_eq!\(\s*runtime\.next_sync_at,\s*'
              r'Some\(now\(\) \+ chrono::Duration::seconds\(120\)\)\s*\);'
          )
          replacement = '\n'.join([
              'let next_sync_at = runtime',
              '    .next_sync_at',
              '    .expect("provider failure schedules a retry");',
              'let retry_delay = next_sync_at - now();',
              'assert!(retry_delay >= chrono::Duration::seconds(120));',
              'assert!(retry_delay <= chrono::Duration::seconds(144));',
          ])
          test, count = pattern.subn(replacement, test, count=1)
          if count != 1:
              raise SystemExit('stale Slack retry assertion target not found exactly once')
          text = text[:function_start] + test + text[function_end:]
          path.write_text(text)
          PY

          cargo fmt --all
          git diff --check

      - name: Validate repaired Slack test
        run: cargo test -p glancelet-core --test slack reactions_collect_every_page_and_page_two_failure_returns_no_batch

      - name: Commit and push repaired test
        run: |
          git add crates/glancelet-core/tests/slack.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: allow bounded Slack retry jitter"
          git push origin "HEAD:${GITHUB_REF_NAME}"
