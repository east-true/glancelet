name: Apply sha2 0.11 compatibility fix

on:
  push:
    branches:
      - dependabot/cargo/sha2-0.11.0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply compatibility change
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/glancelet-core/src/sources/google/mod.rs")
          text = path.read_text()
          import_anchor = "use async_trait::async_trait;\n"
          import_line = "use base64::{engine::general_purpose::URL_SAFE_NO_PAD, Engine};\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Google import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          old = '    let revision = format!("{:x}", Sha256::digest(encoded));\n'
          new = '    let revision = URL_SAFE_NO_PAD.encode(Sha256::digest(encoded));\n'
          if old not in text:
              raise SystemExit("Google revision encoding target not found")
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/apply-sha2-compat.yml
          cargo fmt --all

      - name: Validate core
        run: cargo test -p glancelet-core

      - name: Commit and push
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: encode sha2 0.11 digest explicitly"
          git push origin "HEAD:${GITHUB_REF_NAME}"
