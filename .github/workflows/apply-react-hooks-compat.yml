name: Apply React Hooks 7 compatibility fix

on:
  push:
    branches:
      - dependabot/npm_and_yarn/eslint-plugin-react-hooks-7.1.1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply compatibility changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src/App.tsx")
          text = path.read_text()

          old_effect = (
              "    const timer = window.setInterval(\n"
              "      () => void refresh(false),\n"
              "      DASHBOARD_TIME_REFRESH_MS,\n"
              "    );\n"
              "    void refresh();\n"
              "    return () => {\n"
              "      disposed = true;\n"
              "      unlisten?.();\n"
              "      window.clearInterval(timer);\n"
              "    };\n"
          )
          new_effect = (
              "    const timer = window.setInterval(\n"
              "      () => void refresh(false),\n"
              "      DASHBOARD_TIME_REFRESH_MS,\n"
              "    );\n"
              "    const initialRefresh = window.setTimeout(() => void refresh(), 0);\n"
              "    return () => {\n"
              "      disposed = true;\n"
              "      unlisten?.();\n"
              "      window.clearTimeout(initialRefresh);\n"
              "      window.clearInterval(timer);\n"
              "    };\n"
          )
          if old_effect not in text:
              raise SystemExit("initial dashboard refresh target not found")
          text = text.replace(old_effect, new_effect, 1)

          old_value = (
              "  const today = localDateString(new Date());\n"
              "  const oneHourFromNow = new Date(Date.now() + 60 * 60 * 1000).toISOString();\n"
          )
          if old_value not in text:
              raise SystemExit("snooze render-time target not found")
          text = text.replace(old_value, "  const today = localDateString(new Date());\n", 1)

          old_handler = (
              "          <button\n"
              "            onClick={() =>\n"
              "              void run(work.id, { type: \"snooze\", until: oneHourFromNow })\n"
              "            }\n"
              "          >\n"
          )
          new_handler = (
              "          <button\n"
              "            onClick={() => {\n"
              "              const until = new Date(\n"
              "                Date.now() + 60 * 60 * 1000,\n"
              "              ).toISOString();\n"
              "              void run(work.id, { type: \"snooze\", until });\n"
              "            }}\n"
              "          >\n"
          )
          if old_handler not in text:
              raise SystemExit("snooze click handler target not found")
          path.write_text(text.replace(old_handler, new_handler, 1))
          PY
          rm .github/workflows/apply-react-hooks-compat.yml
          npm ci
          npm run format

      - name: Validate frontend
        run: |
          npm run lint
          npm test
          npm run build

      - name: Commit and push
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: satisfy React Hooks 7 purity rules"
          git push origin "HEAD:${GITHUB_REF_NAME}"
