name: Fix PR 47 test expectations

on:
  push:
    branches:
      - agent/retry-backoff-projection-quarantine

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Align test expectations with retry jitter and schema v5
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/glancelet-core/tests/phase0.rs')
          text = path.read_text()

          migration_start = text.index(
              'fn migration_baseline_handles_fresh_legacy_and_reopened_databases()'
          )
          migration_end = text.index('\n#[test]\n', migration_start)
          migration_test = text[migration_start:migration_end]
          old_version = '\n        4\n    );'
          if migration_test.count(old_version) != 2:
              raise SystemExit('expected exactly two stale schema version assertions')
          migration_test = migration_test.replace(
              old_version,
              '\n        5\n    );',
          )
          text = text[:migration_start] + migration_test + text[migration_end:]

          failure_start = text.index(
              'async fn failed_fetch_does_not_deactivate_and_delta_only_applies_explicit_mutations()'
          )
          failure_end = text.index('\n#[tokio::test]\n', failure_start)
          failure_test = text[failure_start:failure_end]
          old_retry_assertion = '\n'.join([
              '    assert_eq!(',
              '        harness.store.source_runtime("mirror").unwrap().next_sync_at,',
              '        Some(at(10, 1))',
              '    );',
          ])
          new_retry_assertion = '\n'.join([
              '    let next_sync_at = harness',
              '        .store',
              '        .source_runtime("mirror")',
              '        .unwrap()',
              '        .next_sync_at',
              '        .expect("failed sync schedules a retry");',
              '    let retry_delay = next_sync_at - harness.clock.now();',
              '    assert!(retry_delay >= chrono::Duration::seconds(60));',
              '    assert!(retry_delay <= chrono::Duration::seconds(72));',
          ])
          if failure_test.count(old_retry_assertion) != 1:
              raise SystemExit('stale retry timestamp assertion target not found exactly once')
          failure_test = failure_test.replace(old_retry_assertion, new_retry_assertion)
          text = text[:failure_start] + failure_test + text[failure_end:]
          path.write_text(text)
          PY

          cargo fmt --all
          git diff --check

      - name: Validate repaired core tests
        run: |
          cargo test -p glancelet-core --test phase0 migration_baseline_handles_fresh_legacy_and_reopened_databases
          cargo test -p glancelet-core --test phase0 failed_fetch_does_not_deactivate_and_delta_only_applies_explicit_mutations

      - name: Commit and push repaired tests
        run: |
          git add crates/glancelet-core/tests/phase0.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align retry and migration expectations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
