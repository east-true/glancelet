# These exceptions cover transitive dependencies in Tauri's Linux GTK3 stack.
# Keep them scoped to individual advisory IDs so newly reported vulnerabilities
# still fail the weekly scan. Revisit the GTK3 set when Tauri's Linux backend
# can move off the archived gtk3-rs bindings.

